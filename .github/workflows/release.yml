# Builds installable bundles when a version tag (v1.2.3) is pushed and attaches them to a draft release.
# The macOS bundles are ad-hoc signed only: other Macs will need them notarized (Apple Developer account)
# or the user has to clear quarantine manually.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install ninja
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-macos-${{ hashFiles('CMakeLists.txt') }}
      - name: Build universal binary
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DZEROONE_BUILD_TESTS=OFF
          cmake --build build
      - name: Package
        run: |
          cd build/ZeroOne_artefacts/Release
          mkdir -p package-au package-vst3
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/Resources/OFL-Sora.txt" package-au/
          cp "$GITHUB_WORKSPACE/LICENSE" "$GITHUB_WORKSPACE/Resources/OFL-Sora.txt" package-vst3/
          ditto AU/01.component package-au/01.component
          ditto VST3/01.vst3 package-vst3/01.vst3
          ditto -c -k package-au "$GITHUB_WORKSPACE/Inscript-macOS-AU.zip"
          ditto -c -k package-vst3 "$GITHUB_WORKSPACE/Inscript-macOS-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Inscript-*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}
      - name: Build
        run: |
          cmake -B build -DZEROONE_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item -Recurse build/ZeroOne_artefacts/Release/VST3/01.vst3 package/01.vst3
          Copy-Item LICENSE,Resources/OFL-Sora.txt package/
          Compress-Archive -Path package/* -DestinationPath "Inscript-Windows-VST3.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Inscript-*.zip

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Inscript-*.zip --repo "$GITHUB_REPOSITORY" --draft --generate-notes
